function renderModels(){$('#main').innerHTML=header('The right model<br>for your words.','Every option below can clone your voice. We first check language coverage, then consider your setup preference. The final choice is yours.')+`<label class="field-label">What matters for setup?</label><div class="choice-toggle" role="group" aria-label="Setup preference"><button data-action="preference" data-value="reuse" class="${preference==='reuse'?'on':''}" aria-pressed="${preference==='reuse'}">Reuse an installed model</button><button data-action="preference" data-value="compact" class="${preference==='compact'?'on':''}" aria-pressed="${preference==='compact'}">Smallest model</button></div><div class="model-list">${S.plan.models.map(m=>`<section class="model-card ${model===m.id?'selected':''} ${!m.eligible?'unavailable':''}" aria-label="${esc(m.label)}"><div class="head"><div><h2>${esc(m.label)}</h2><div class="quiet">${esc(m.tagline)}</div></div>${S.plan.recommended===m.id?'<span class="tag">Recommended for this setup</span>':m.installed?'<span class="tag grey">Installed</span>':''}</div><p class="reason">${esc(m.reason)}${m.eligible&&m.installed?' No additional model download needed.':''}</p><div class="meta"><span>${bytes(m.bytes)} model</span><span>Uses your voice</span><span>Runs locally</span></div><details><summary>Why this model?</summary><p>${esc(m.details)}</p><p>${esc(m.verification)}</p><a href="${esc(m.source)}" target="_blank" rel="noreferrer">Model documentation</a></details><div class="bottom"><span class="quiet">${m.eligible?(model===m.id?'Selected':'Available for your languages'):'Language coverage does not match'}</span><button class="btn ${model===m.id?'primary':'secondary'} compact" data-action="select-model" data-model="${m.id}" ${!m.eligible?'disabled':''} aria-pressed="${model===m.id}">${model===m.id?'Selected':'Choose model'}</button></div></section>`).join('')}</div><div class="notice">A recommendation means a suitable fit, not a promise of better s function renderAudition(){if(!selected.includes(auditionLang))auditionLang=selected[0];const l=language(auditionLang),a=auditions[auditionLang],used=accepted(auditionLang)&&S.config.accepted[auditionLang]?.id===a?.id,done=selected.every(accepted),ref=recordRef(auditionLang);if(drafts[auditionLang]===undefined)drafts[auditionLang]=l.sample||l.prompt||'';

const waveCache=new Map();
function drawRecordingWave(canvas,points,rtl=false){
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 const dpr=window.devicePixelRatio||1,pw=Math.round(w*dpr),ph=Math.round(h*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}
 const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);

 for(let i=0;i<n;i++){
  const value=points[start+i]||0,height=Math.max(2,Math.min(1,value)*(h-16)),x=(rtl?n-1-i:i)*slot;
  g.fillStyle=i<Math.min(points.length,n)?'#f3a28b':'#354355';

}
async function renderReferenceWave(url){const canvas=$('#reference-wave'),player=$('#reference-player');if(!canvas||!player)return;try{let points=waveCache.get(url);if(!points){const response=await fetch(url);if(!response.ok)throw Error('Reference not available');const decoder=new OfflineAudioContext(1,1,24000),audio=await decoder.decodeAudioData(await response.arrayBuffer()),samples=audio.getChannelData(0),count=140,stride=Math.max(1,Math.floor(samples.length/count));points=Array.from({length:count},(_,i)=>{let peak=0;for(let j=i*stride;j<Math.min((i+1)*stride,samples.length);j++)peak=Math.max(peak,Math.abs(samples[j]));return peak});waveCache.set(url,points);if(waveCache.size>12)waveCache.delete(waveCache.keys().next().value)}if(!canvas.isConnected)return;canvas.width=1120;canvas.height=130;const g=canvas.getContext('2d');let waveFrame=0;const paint=()=>{cancelAnimationFrame(waveFrame);waveFrame=0;if(!canvas.isConnected)return;g.clearRect(0,0,1120,130);const progress=player.duration?player.currentTime/player.duration:0;for(let i=0;i<points.length;i++){const h=Math.max(3,Math.min(112,points[i]*165));g.fillStyle=i/points.length<progress?'#f4b69c':'#a76f61';g.beginPath();g.roundRect(i*8+1,(130-h)/2,5,h,2.5);g.fill()}if(progress){g.fillStyle='#f5d4bc';g.fillRect(progress*1120,7,1.5,116)}if(!player.paused&&!player.ended)waveFrame=requestAnimationFrame(paint)};player.addEventListener('play',paint);player.addEventListener('seeked',paint);player.addEventListener('timeupdate',paint);paint()}catch(e){if(canvas.isConnected)canvas.parentElement.hidden=true}}

async function poll(){await refresh();if(step===3)render();if(['checking','downloading','verifying'].includes(S.setup.state))pollTimer=setTimeout(()=>poll().catch(failure),900);else if(S.setup.state==='ready')model=S.config.engine;}
async function startRecording(){const text=$('#record-script')?.value.trim();if(!text){toast('Enter the words you will read first.');return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:{});const chunks=[],started=Date.now(),code=recordLang;context=new AudioContext();const analyser=context.createAnalyser();analyser.fftSize=1024;context.createMediaStreamSource(recordStream).connect(analyser);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{clearInterval(recClock);cancelAnimationFrame(raf);recordStream.getTracks().forEach(t=>t.stop());await context.close();const blob=new Blob(chunks,{type:recorder.mimeType});pending={blob,url:URL.createObjectURL(blob),text,lang:code,seconds:(Date.now()-started)/1000};recordMode=true;render()};recorder.start();render();const wave=$('#wave'),buffer=new Float32Array(analyser.fftSize),history=[];let sampledAt=0;
 const paint=time=>{if(!wave.isConnected)return;if(!sampledAt||time-sampledAt>=40){analyser.getFloatTimeDomainData(buffer);let peak=0;for(const value of buffer)peak=Math.max(peak,Math.abs(value));history.push(Math.min(1,peak*1.6));while(history.length>Math.max(1,Math.floor(wave.clientWidth/6)))history.shift();sampledAt=time}drawRecordingWave(wave,history,language(code).rtl);raf=requestAnimationFrame(paint)};
 paint(0);recClock=setInterval(()=>{const elapsed=(Date.now()-started)/1000;const el=$('#record-time');if(el)el.textContent='Recording · 0:'+String(Math.floor(elapsed)).padStart(2,'0');if(elapsed>=35&&recorder.state==='recording')recorder.stop()},200)}catch(e){recordStream?.getTracks().forEach(t=>t.stop());failure(Error('Microphone access was not available. Allow this local studio to use your microphone, then try again.'))}}
async function handle(action,el){if(action==='language'){const c=el.dataset.code;selected=selected.includes(c)?selected.filter(x=>x!==c):selected.length<12?[...selected,c]:selected;render();return}if(action==='step'){go(Number(el.dataset.step));return}if(action==='back'){go(step-1);return}
 if(action==='languages-next'){S=await api('/api/preferences',{languages:selected,preference});model=S.plan.recommended;go(2);return}
 if(action==='preference'){preference=el.dataset.value;S.plan=await api('/api/recommend',{languages:selected,preference});model=S.plan.recommended;render();return}
 if(action==='select-model'){model=el.dataset.model;render();return}if(action==='model-next'){go(3);return}
 if(action==='setup-start'){S.setup=await api('/api/setup',{languages:selected,model,preference});render();clearTimeout(pollTimer);pollTimer=setTimeout(()=>poll().catch(failure),400);return}if(action==='setup-next'){recordLang=selected[0];go(4);return}
 if(action==='record-tab'){if(recorder?.state==='recording'||pending){toast('Use or discard the current take first.');return}recordLang=el.dataset.code;recordMode=false;referenceChoice=null;render();return}
 if(action==='record-again'){referenceChoice=null;recordMode=true;render();return}if(action==='record'){if(recorder?.state==='recording')recorder.stop();else await startRecording();return}
 if(action==='discard'){URL.revokeObjectURL(pending.url);pending=null;recordMode=false;render();return}
 if(action==='save-recording'){el.disabled=true;const usedLanguage=pending.lang,q=new URLSearchParams({lang:pending.lang,text:pending.text});const r=await fetch('/api/reference?'+q,{method:'POST',body:pending.blob});const d=await r.json();if(!r.ok||d.error){el.disabled=false;throw Error(d.error)}URL.revokeObjectURL(pending.url);pending=null;recordMode=false;await refresh();render();toast(usedLanguage==='en'?'English is now your default reference. Existing language overrides stay unchanged.':'This language now uses your new recording. Other language choices are unchanged.');return}
 if(action==='use-reference'){if(!referenceChoice||referenceChoice.language!==recordLang)return;el.disabled=true;S=await api('/api/reference-choice',referenceChoice);referenceChoice=null;render();toast('This language now uses the selected recording.');return}
 if(action==='record-next'){auditionLang=selected[0];go(5);return}if(action==='audition-tab'){if(busy)return;auditionLang=el.dataset.code;render();return}
 if(action==='generate'){const text=$('#audition-script').value.trim();if(!text){toast('Write a short line to speak first.');return}drafts[auditionLang]=text;busy=true;error='';render();try{const a=await api('/api/generate',{engine:S.config.engine,lang:auditionLang,text,mine:true,reference:recordRef(auditionLang)});auditions[auditionLang]=a;}finally{busy=false;render()}return}
 if(action==='accept'){await api('/api/accept',{id:auditions[auditionLang].id});await refresh();render();toast('Audition accepted for '+language(auditionLang).name+'.');return}
 if(action==='finish'){S=await api('/api/finish',{});render();toast('Your voice profile is ready for narration.');return}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)handle(el.dataset.action,el).catch(failure)});
document.addEventListener('input',e=>{if(e.target.id==='language-search'){search=e.target.value;const pos=e.target.selectionStart;renderLanguages();$('#language-search').focus();$('#language-search').setSelectionRange(pos,pos)}if(e.target.id==='audition-script')drafts[auditionLang]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='reference-select'&&e.target.value){if(recorder?.state==='recording'||pending)return;recordMode=false;referenceChoice=e.target.value===recordRef(recordLang)?null:{language:recordLang,reference:e.target.value};render()}});
$('#edit-setup').onclick=()=>go(1);
(async()=>{await refresh();selected=[...S.config.languages];preference=S.config.preference||'reuse';model=S.config.engine;recordLang=selected[0];auditionLang=selected[0];auditions=S.auditions||{};if(S.config.setupReady&&S.config.setupModel===model&&selected.every(c=>modelInfo()?.languages.includes(c))){furthest=5;step=S.config.profileReady?5:4}if(['checking','downloading','verifying'].includes(S.setup.state)){step=3;furthest=3}render();if(['checking','downloading','verifying'].includes(S.setup.state))pollTimer=setTimeout(()=>poll().catch(failure),500)})().catch(e=>{$('#main').innerHTML='<h1>Unable to open the studio.</h1><p>'+esc(e.message)+'</p>'});
</script></body></html>
