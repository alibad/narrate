// A shadcn-style select: a button that opens a listbox, with keyboard support and no native <select>.
const CHEVRON='<svg class="dd-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',CHECK='<svg class="dd-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
function dropdown(id,placeholder,value,options,labelledby){const cur=options.find(o=>o.value===value);return `<div class="dd"><button type="button" class="dd-trigger" id="${id}" data-action="dd-toggle" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${labelledby} ${id}"><span class="dd-value${cur?'':' placeholder'}">${cur?cur.html:esc(placeholder)}</span>${CHEVRON}</button><div class="dd-menu" role="listbox" aria-labelledby="${labelledby}" hidden>${options.map(o=>`<button type="button" class="dd-option" role="option" data-action="dd-pick" data-dd="${id}" data-value="${esc(o.value)}" aria-selected="${o.value===value}" tabindex="-1">${o.html}${CHECK}</button>`).join('')}</div></div>`}
function closeMenus(except){document.querySelectorAll('.dd-menu:not([hidden])').forEach(m=>{if(m!==except){m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false')}})}
function openMenu(trigger){const menu=trigger.nextElementSibling,r=trigger.getBoundingClientRect();closeMenus(menu);menu.hidden=false;trigger.setAttribute('aria-expanded','true');menu.classList.toggle('up',innerHeight-r.bottom<Math.min(300,menu.scrollHeight+16)&&r.top>innerHeight-r.bottom);(menu.querySelector('[aria-selected=true]')||menu.querySelector('.dd-option'))?.focus({preventScroll:true})}
const waveCache=new Map();
function drawRecordingWave(canvas,points,rtl=false){
 const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 const dpr=window.devicePixelRatio||1,pw=Math.round(w*dpr),ph=Math.round(h*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}
 const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const n=Math.max(1,Math.floor(w/6)),slot=w/n,start=Math.max(0,points.length-n);
 for(let i=0;i<n;i++){
  const value=points[start+i]||0,height=Math.max(2,Math.min(1,value)*(h-16)),x=(rtl?n-1-i:i)*slot;
  g.fillStyle=i<Math.min(points.length,n)?'#f3a28b':'#354355';
  g.beginPath();g.roundRect(x+slot*.18,(h-height)/2,Math.max(1,slot*.64),height,2);g.fill();
 }
}
async function renderReferenceWave(url){const canvas=$('#reference-wave'),player=$('#reference-player');if(!canvas||!player)return;try{let points=waveCache.get(url);if(!points){const response=await fetch(url);if(!response.ok)throw Error('Reference not available');const decoder=new OfflineAudioContext(1,1,24000),audio=await decoder.decodeAudioData(await response.arrayBuffer()),samples=audio.getChannelData(0),count=140,stride=Math.max(1,Math.floor(samples.length/count));points=Array.from({length:count},(_,i)=>{let peak=0;for(let j=i*stride;j<Math.min((i+1)*stride,samples.length);j++)peak=Math.max(peak,Math.abs(samples[j]));return peak});waveCache.set(url,points);if(waveCache.size>12)waveCache.delete(waveCache.keys().next().value)}if(!canvas.isConnected)return;canvas.width=1120;canvas.height=130;const g=canvas.getContext('2d');let waveFrame=0;const paint=()=>{cancelAnimationFrame(waveFrame);waveFrame=0;if(!canvas.isConnected)return;g.clearRect(0,0,1120,130);const progress=player.duration?player.currentTime/player.duration:0;for(let i=0;i<points.length;i++){const h=Math.max(3,Math.min(112,points[i]*165));g.fillStyle=i/points.length<progress?'#f4b69c':'#a76f61';g.beginPath();g.roundRect(i*8+1,(130-h)/2,5,h,2.5);g.fill()}if(progress){g.fillStyle='#f5d4bc';g.fillRect(progress*1120,7,1.5,116)}if(!player.paused&&!player.ended)waveFrame=requestAnimationFrame(paint)};player.addEventListener('play',paint);player.addEventListener('seeked',paint);player.addEventListener('timeupdate',paint);paint()}catch(e){if(canvas.isConnected)canvas.parentElement.hidden=true}}
async function refresh(){S=await api('/api/status')}
async function poll(){await refresh();if(step===3)render();if(['checking','downloading','verifying'].includes(S.setup.state))pollTimer=setTimeout(()=>poll().catch(failure),900);else if(S.setup.state==='ready')model=S.config.engine;}
async function startRecording(){if(guideBusy||nativeBusy)return;stopAudio();const text=$('#record-script')?.value.trim();if(!text){toast('Enter the words you will read first.');return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:{});const chunks=[],started=Date.now(),code=recordLang;context=new AudioContext();const analyser=context.createAnalyser();analyser.fftSize=1024;context.createMediaStreamSource(recordStream).connect(analyser);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{clearInterval(recClock);cancelAnimationFrame(raf);recordStream.getTracks().forEach(t=>t.stop());await context.close();const blob=new Blob(chunks,{type:recorder.mimeType});pending={blob,url:URL.createObjectURL(blob),text,lang:code,seconds:(Date.now()-started)/1000};recordMode=true;render()};recorder.start();render();const wave=$('#wave'),buffer=new Float32Array(analyser.fftSize),history=[];let sampledAt=0;
 const paint=time=>{if(!wave.isConnected)return;if(!sampledAt||time-sampledAt>=40){analyser.getFloatTimeDomainData(buffer);let peak=0;for(const value of buffer)peak=Math.max(peak,Math.abs(value));history.push(Math.min(1,peak*1.6));while(history.length>Math.max(1,Math.floor(wave.clientWidth/6)))history.shift();sampledAt=time}drawRecordingWave(wave,history,language(code).rtl);raf=requestAnimationFrame(paint)};
 paint(0);recClock=setInterval(()=>{const elapsed=(Date.now()-started)/1000;const el=$('#record-time');if(el)el.textContent='Recording · 0:'+String(Math.floor(elapsed)).padStart(2,'0');if(elapsed>=35&&recorder.state==='recording')recorder.stop()},200)}catch(e){recordStream?.getTracks().forEach(t=>t.stop());failure(Error('Microphone access was not available. Allow this local studio to use your microphone, then try again.'))}}
async function handle(action,el){if(action==='language'){const c=el.dataset.code,top=$('.language-grid')?.scrollTop||0,y=scrollY;selected=selected.includes(c)?selected.filter(x=>x!==c):selected.length<12?[...selected,c]:selected;render();
  // Keep the list and the page where they were; re-rendering would otherwise jump back to the top.
  const grid=$('.language-grid');if(grid)grid.scrollTop=top;scrollTo(0,y);$(`.lang-card[data-code="${c}"]`)?.focus({preventScroll:true});return}
 if(action==='dd-toggle'){if(el.nextElementSibling.hidden)openMenu(el);else closeMenus();return}
 if(action==='dd-pick'){closeMenus();$('#'+el.dataset.dd)?.focus({preventScroll:true});if(el.dataset.dd==='reference-select'){if(recorder?.state==='recording'||pending)return;stopAudio();recordMode=false;referenceChoice=el.dataset.value===recordRef(recordLang)?null:{language:recordLang,reference:el.dataset.value};render()}return}
 if(action==='drop-uncovered'){const gap=uncovered();selected=selected.filter(c=>!gap.includes(c));S=await api('/api/preferences',{languages:selected,preference});model=S.plan.recommended;render();toast('Removed '+names(gap)+'.');return}
 if(action==='native-example'){if(nativeBusy||guideBusy||busy||recorder?.state==='recording'||pending)return;const context=el.dataset.context,lang=context==='audition'?auditionLang:recordLang,l=language(lang),text=(context==='audition'?drafts[lang]:context==='record'?recordDrafts[lang]??l.prompt:l.prompt)?.trim();if(!text)return;stopAudio();const cached=nativeExamples[lang];if(cached?.text===text&&cached.voice===S.pronunciation?.[lang]?.voice&&cached.locale===S.pronunciation?.[lang]?.locale&&cached.engine===S.pronunciation?.[lang]?.engine&&cached.model===S.pronunciation?.[lang]?.model&&cached.revision===S.pronunciation?.[lang]?.revision){const p=$('#native-player');if(p){p.currentTime=0;await p.play().catch(()=>toast('Press play on the pronunciation example.'))}return}nativeBusy=true;error='';render();try{nativeExamples[lang]={...await api('/api/pronunciation',{lang,text,engine:S.config.engine}),text}}finally{nativeBusy=false;render()}$('#native-player')?.play().catch(()=>toast('Press play on the pronunciation example.'));return}
 if(action==='guide'){if(nativeBusy||guideBusy||recorder?.state==='recording'||pending)return;stopAudio();const lang=recordLang,text=($('#record-script')?.value||'').trim();if(!text){toast('Enter the words first.');return}recordDrafts[lang]=text;guideBusy=true;error='';render();try{guides[lang]={...await api('/api/guide',{lang,text}),text}}finally{guideBusy=false;render()}$('#guide-player')?.play().catch(()=>{});return}
 if(action==='guide-play'){if(nativeBusy||guideBusy||recorder?.state==='recording'||pending)return;stopAudio();const p=$('#guide-player');if(p){p.currentTime=0;p.play().catch(()=>{})}return}if(action==='step'){go(Number(el.dataset.step));return}if(action==='back'){go(step-1);return}
 if(action==='languages-next'){S=await api('/api/preferences',{languages:selected,preference});model=S.plan.recommended;go(2);return}
 if(action==='preference'){preference=el.dataset.value;S.plan=await api('/api/recommend',{languages:selected,preference});model=S.plan.recommended;render();return}
 if(action==='select-model'){model=el.dataset.model;render();return}if(action==='model-next'){go(3);return}
 if(action==='setup-start'){S.setup=await api('/api/setup',{languages:selected,model,preference});render();clearTimeout(pollTimer);pollTimer=setTimeout(()=>poll().catch(failure),400);return}if(action==='setup-next'){recordLang=selected[0];go(4);return}
 if(action==='record-tab'){if(guideBusy||nativeBusy)return;stopAudio();if(recorder?.state==='recording'||pending){toast('Use or discard the current take first.');return}recordLang=el.dataset.code;recordMode=false;referenceChoice=null;render();return}
 if(action==='record-again'){if(guideBusy||nativeBusy)return;stopAudio();referenceChoice=null;recordMode=true;render();return}if(action==='record'){if(recorder?.state==='recording')recorder.stop();else await startRecording();return}
 if(action==='discard'){URL.revokeObjectURL(pending.url);pending=null;recordMode=false;render();return}
 if(action==='save-recording'){el.disabled=true;const usedLanguage=pending.lang,q=new URLSearchParams({lang:pending.lang,text:pending.text});const r=await fetch('/api/reference?'+q,{method:'POST',body:pending.blob});const d=await r.json();if(!r.ok||d.error){el.disabled=false;throw Error(d.error)}URL.revokeObjectURL(pending.url);pending=null;recordMode=false;await refresh();render();toast(usedLanguage==='en'?'English is now your default reference. Existing language overrides stay unchanged.':'This language now uses your new recording. Other language choices are unchanged.');return}
 if(action==='use-reference'){if(!referenceChoice||referenceChoice.language!==recordLang)return;el.disabled=true;S=await api('/api/reference-choice',referenceChoice);referenceChoice=null;render();toast('This language now uses the selected recording.');return}
 if(action==='record-next'){auditionLang=selected[0];go(5);return}if(action==='audition-tab'){if(busy||nativeBusy)return;stopAudio();auditionLang=el.dataset.code;render();return}
 if(action==='generate'){if(nativeBusy)return;stopAudio();const text=$('#audition-script').value.trim();if(!text){toast('Write a short line to speak first.');return}drafts[auditionLang]=text;busy=true;error='';render();try{const a=await api('/api/generate',{engine:S.config.engine,lang:auditionLang,text,mine:true,reference:recordRef(auditionLang)});auditions[auditionLang]=a;}finally{busy=false;render()}return}
 if(action==='accept'){await api('/api/accept',{id:auditions[auditionLang].id});await refresh();render();toast('Audition accepted for '+language(auditionLang).name+'.');return}
 if(action==='use-english-for-all'){if(busy||nativeBusy||guideBusy||pending||recorder?.state==='recording')return;S=await api('/api/use-english-for-all',{});await refresh();render();toast('Your accepted English voice is shared across all selected languages.');return}
 if(action==='finish'){S=await api('/api/finish',{});render();toast('Your voice profile is ready for narration.');return}}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeMenus();const el=e.target.closest('[data-action]');if(el&&!el.disabled)handle(el.dataset.action,el).catch(failure)});
document.addEventListener('keydown',e=>{const t=e.target;if(t.classList?.contains('dd-trigger')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();openMenu(t);return}const menu=t.closest?.('.dd-menu');if(!menu)return;const items=[...menu.querySelectorAll('.dd-option')],i=items.indexOf(t);
 if(e.key==='Escape'){e.preventDefault();closeMenus();menu.previousElementSibling.focus()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}else if(e.key==='Home'||e.key==='End'){e.preventDefault();items[e.key==='Home'?0:items.length-1].focus()}else if(e.key==='Tab')closeMenus()});
document.addEventListener('input',e=>{if(e.target.id==='language-search'){search=e.target.value;const pos=e.target.selectionStart;renderLanguages();$('#language-search').focus();$('#language-search').setSelectionRange(pos,pos)}if(e.target.id==='audition-script')drafts[auditionLang]=e.target.value;if(e.target.id==='record-script'){recordDrafts[recordLang]=e.target.value;const part=$('.pronunciation[data-pronunciation-context=record]');if(part)part.outerHTML=pronunciationBlock(language(recordLang),e.target.value,'record')}if(e.target.id==='audition-script'){const part=$('.pronunciation[data-pronunciation-context=audition]');if(part)part.outerHTML=pronunciationBlock(language(auditionLang),e.target.value,'audition')}});
$('#edit-setup').onclick=()=>go(1);
(async()=>{await refresh();selected=[...S.config.languages];preference=S.config.preference||'reuse';model=S.config.engine;recordLang=selected[0];auditionLang=selected[0];auditions=S.auditions||{};if(S.config.setupReady&&S.config.setupModel===model&&selected.every(c=>modelInfo()?.languages.includes(c))){furthest=5;step=S.config.profileReady?5:4}if(['checking','downloading','verifying'].includes(S.setup.state)){step=3;furthest=3}render();if(['checking','downloading','verifying'].includes(S.setup.state))pollTimer=setTimeout(()=>poll().catch(failure),500)})().catch(e=>{$('#main').innerHTML='<h1>Unable to open the studio.</h1><p>'+esc(e.message)+'</p>'});
</script></body></html>
